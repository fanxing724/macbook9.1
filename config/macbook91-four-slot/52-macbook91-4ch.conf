# MacBook9,1 CS4208: the speaker amplifiers require four 16-bit TDM slots.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = {
      device.profile-set = "/usr/share/macbook91-cs4208/acp/macbook91-cs4208.conf"
      device.profile = "output:analog-surround-40+input:analog-stereo"
      api.alsa.soft-mixer = true
      api.acp.auto-profile = false
      api.acp.auto-port = false
    } }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-0000_00_1f.3.analog-surround-40.*" } ]
    actions = { update-props = {
      node.description = "内置扬声器"
      audio.format = "S16LE"
      audio.rate = 44100
      channelmix.upmix = true
      channelmix.upmix-method = "simple"
    } }
  }
]
