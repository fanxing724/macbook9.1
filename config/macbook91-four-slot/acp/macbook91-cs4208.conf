; MacBook9,1 (A1534) CS4208 - ACP profile set.
;
; WHY THIS FILE EXISTS
;
; Two reasons, both consequences of the internal speaker path being a
; four-slot TDM frame that the codec drives from converter 0x0a:
;
; 1. The internal PCM (hw:0,0) accepts exactly one configuration - S16_LE,
;    44100 Hz, 4 channels. Every analog mapping in the stock `default.conf`
;    except analog-surround-40 therefore describes a profile this card cannot
;    open. They still appear in the desktop's device list, and selecting one
;    yields a sink that fails on first use.
;
; 2. The single analog output port must stay available while the headphone jack
;    is plugged, because the driver - not the session manager - moves the stream
;    to the headphone converter. `macbook91-output-speaker` provides that; see
;    that file for the failure it fixes.
;
; So this set offers one analog output mapping, one analog input mapping, and
; the HDMI mappings unchanged. The mapping names `analog-surround-40` and
; `analog-stereo` are deliberately the stock ones, so profile and route state
; already stored by WirePlumber keeps matching.
;
; Selected per-card through `device.profile-set` in
; /usr/share/wireplumber/wireplumber.conf.d/51-macbook91-cs4208.conf, which
; matches this machine's audio controller only. No other card is affected.
;
; PROVENANCE
;   mappings derived from
;   /usr/share/alsa-card-profile/mixer/profile-sets/default.conf
;   alsa-card-profiles 1:1.6.8-1
;
; Licensed LGPL-2.1-or-later, as the file it derives from.

[General]
auto-profiles = yes

; The internal speakers. Four TDM slots, two stereo pairs; the WirePlumber
; drop-in turns the front pair into both pairs with a plain copy upmix.
; Absolute path because this file does not live in the stock profile-sets
; directory and the path file does not live in the stock paths directory.
[Mapping analog-surround-40]
description = Internal Speakers and Headphones
device-strings = hw:%f
channel-map = front-left,front-right,rear-left,rear-right
paths-output = /usr/share/macbook91-cs4208/acp/macbook91-output-speaker.conf
priority = 100
direction = output

; Internal microphone and the headset microphone on the combo jack.
[Mapping analog-stereo]
device-strings = hw:%f
channel-map = left,right
paths-input = analog-input-internal-mic analog-input-mic analog-input
priority = 90
direction = input

[Mapping hdmi-stereo]
description = Digital Stereo (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output

[Mapping hdmi-surround]
description = Digital Surround 5.1 (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 8
direction = output

[Mapping hdmi-surround71]
description = Digital Surround 7.1 (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe,side-left,side-right
priority = 8
direction = output

[Mapping hdmi-stereo-extra1]
description = Digital Stereo (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-surround-extra1]
description = Digital Surround 5.1 (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 6
direction = output

[Mapping hdmi-stereo-extra2]
description = Digital Stereo (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-surround-extra2]
description = Digital Surround 5.1 (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
priority = 6
direction = output
